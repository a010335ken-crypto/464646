<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棒球紀錄表</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1c2a1f;--mut:#667;--ac:#1f7a3a;--ac2:#e87d1e;--bd:#d6dcd4;--grass:#2e9a4b;--dirt:#d08a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1c2620;--tx:#e8f0ea;--mut:#9aa89d;--bd:#33423a;--grass:#1f6e37;--dirt:#a86a3c}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1c2620;--tx:#e8f0ea;--mut:#9aa89d;--bd:#33423a;--grass:#1f6e37;--dirt:#a86a3c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-top:54px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ac);z-index:10}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:54px;background:var(--ac);display:flex;z-index:11}
nav button{flex:1;border:0;background:none;color:#fff;font-size:13px;opacity:.7;padding:4px 0}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{opacity:1;border-bottom:3px solid var(--ac2)}
main{max-width:520px;margin:0 auto;padding:12px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px}
.home{text-align:center}.home img{width:190px;max-width:60%;border-radius:50%}
.vs{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:700;margin:10px 0;flex-wrap:wrap}
.vs i{color:var(--ac2)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;min-width:0}
.vs input{width:9em;text-align:center;font-size:20px;font-weight:700}
.row{display:flex;gap:6px;margin:6px 0;align-items:center}.row>*{flex:1}
.row label{flex:0 0 4.2em;color:var(--mut);font-size:13px}
.btn{border:0;border-radius:10px;background:var(--ac);color:#fff;padding:11px;font:inherit;font-weight:600}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#c0392b}
.go{width:100%;margin-top:8px}
.rost #rl>div{display:grid;grid-template-columns:1.6em 3.4em 1fr 4.4em 5.4em;gap:5px;margin:5px 0;align-items:center}
.rost span{color:var(--mut);text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:6px 11px;font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.res .chip{border-radius:10px;padding:10px 0;text-align:center}
.res .h{border-color:var(--ac);color:var(--ac);font-weight:700}.res .o2{color:var(--mut)}
svg.f{width:100%;display:block;touch-action:manipulation;border-radius:10px;background:var(--card)}
.step{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:8px 0}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.step b{min-width:2em;text-align:center;font-size:18px}
.log div{padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px;display:flex;justify-content:space-between}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:center;white-space:nowrap}
th,td{border:1px solid var(--bd);padding:5px 6px}th{background:var(--bg);font-weight:600}
td.n{text-align:left;position:sticky;left:0;background:var(--card)}
td button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;width:24px;height:24px}
.hint{color:var(--mut);font-size:12px}
.sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}.sum input{width:3.4em;text-align:center}
td.c{vertical-align:top;min-width:50px;height:46px;padding:2px;cursor:pointer}.g{font-size:12px;line-height:1.3;margin:1px 0;border-radius:4px}.g.h{background:#ffd400;color:#000}
nav button{font-size:12px}
.rost select{padding:7px 2px}
.rost #rl>div.off{opacity:.55}.rost #rl>div.off input,.rost #rl>div.off select{background:#9996}
.rost #rl>div.sep{display:block;color:var(--mut);font-size:13px;margin-top:12px}
.rost button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 6px;font:inherit;font-size:12px}
tr.off td{background:#9993;color:var(--mut)}tr.off td.n{background:var(--bg)}
</style>
</head>
<body>
<nav>
<button data-t="home" class="on"><b>⚾</b>首頁</button>
<button data-t="roster"><b>👥</b>名單</button>
<button data-t="rec"><b>✍️</b>紀錄</button>
<button data-t="grid"><b>🗒️</b>逐局</button>
<button data-t="stat"><b>📊</b>成績</button>
<button data-t="pit"><b>🎯</b>投手</button>
</nav>
<main>

<script>
var KEY="tms_bb_v1",S,R=[["1B","一安",1],["2B","二安",1],["3B","三安",1],["HR","全打",1],["BB","四壞"],["HBP","觸身"],["K","三振"],["GO","滾地"],["FO","飛球"],["SH","犧打"],["SF","犧飛"],["DP","雙殺"],["E","失誤"],["FC","野選"]];
function mk(){return{ro:Array.from({length:20},function(){return{no:"",nm:"",pos:"",r:0,sb:0}}),log:[],cur:0,ch:Array.from({length:9},function(_,k){return[k]})}}
function init(){var a=mk(),b=mk();return{inn:1,t:0,rbi:0,loc:null,ro:a.ro,log:a.log,ch:a.ch,cur:0,team:[a,b],f:{},ex:{},pit:[{nm:"",pc:0,k:0,bb:0,h:0,r:0}]}}
function posSel(v,i,d){var L=["","P","C","1B","2B","3B","SS","LF","CF","RF","DH","PH","PR"];if(v&&L.indexOf(v)<0)L.push(v);return '<select data-i="'+i+'" data-k="pos"'+(d?" disabled":"")+'>'+L.map(function(x){return'<option'+(x==v?' selected':'')+'>'+x+'</option>'}).join("")+'</select>'}
function link(){var T=S.team[S.t];while(T.ro.length<20)T.ro.push({no:"",nm:"",pos:"",r:0,sb:0});if(!T.ch)T.ch=Array.from({length:9},function(_,k){return[k]});S.ro=T.ro;S.log=T.log;S.ch=T.ch;S.cur=T.cur||0}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.ro)S=init();else{if(!S.team)S.team=[{ro:S.ro,log:S.log,cur:S.cur||0},mk()];S.t=S.t||0;link()}}
function save(){try{S.team[S.t].cur=S.cur;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function tab(t){document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id==t)});document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t==t)});scrollTo(0,0);draw()}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab(b.dataset.t)}});
["opp","date","venue","side","gno","rcd","coach"].forEach(function(i){$(i).oninput=function(){S.f[i]=this.value;save()}});
["wrbi","dp","lob","po"].forEach(function(i){$(i).oninput=function(){S.ex[i]=this.value;save();summ()}});
function nm(i){var p=S.ro[i];return (p.no?"#"+p.no+" ":"")+(p.nm||"")}
function bname(i){return (slotOf(i)>=0?(slotOf(i)+1)+"棒 ":"替 ")+(S.ro[i].nm||(S.ro[i].no?"#"+S.ro[i].no:""))+(S.ro[i].pos?" "+S.ro[i].pos:"")}
function rrow(j,lab,off,k){var p=S.ro[j],d=off?" disabled":"",a="";
if(k>=0){a='<button onclick="subOpen('+k+')">換人</button>';if(S.ch[k].length>1&&!S.log.some(function(l){return l.b==j}))a+=' <button onclick="subUndo('+k+')">↩</button>'}else if(off)a='<small>'+(p.out||"")+'局下</small>';
return '<div'+(off?' class="off"':'')+'><span>'+lab+'</span><input value="'+p.no+'" inputmode="numeric" placeholder="號" data-i="'+j+'" data-k="no"'+d+'><input value="'+p.nm+'" placeholder="姓名" data-i="'+j+'" data-k="nm"'+d+'>'+posSel(p.pos,j,off)+'<span>'+a+'</span></div>'}
function rosterUI(){var h="";S.ch.forEach(function(c,k){c.forEach(function(j,n){var last=n==c.length-1;h+=rrow(j,n?"↳":k+1,!last,last?k:-1)})});
h+='<div class="sep">替補球員（尚未上場，共可登錄 20 人）</div>';for(var j=0;j<S.ro.length;j++)if(slotOf(j)<0)h+=rrow(j,"替",false,-1);
$("rl").innerHTML=h;$("rt").textContent=tname(S.t)+" 隊伍名單";$("rh").textContent=(S.t?"對方以背號為主，姓名可不填。":"")+"點「換人」可換下該棒次球員；被換下者會變灰、不可再上場。";
$("rl").oninput=function(e){var t=e.target;S.ro[t.dataset.i][t.dataset.k]=t.value;save();if(SUB>=0)subUI()};subUI()}
function tname(t){return t?(S.f.opp||"對方"):"淡江高中"}
function isBot(t){return (t==0)==((S.f.side||"先攻")=="後攻")}
function tg(){var h="";[0,1].forEach(function(t){h+='<button class="chip'+(t==S.t?" on":"")+'" onclick="setT('+t+')">'+tname(t)+'</button>'});document.querySelectorAll(".tg").forEach(function(e){e.innerHTML=h})}
function setT(t){if(t==S.t)return;SUB=-1;S.team[S.t].cur=S.cur;S.t=t;link();S.loc=null;S.rbi=0;save();rosterUI();draw();scrollTo(0,0)}
function endHalf(){if(isBot(S.t))S.inn++;setT(1-S.t)}
$("side").onchange=function(){S.f.side=this.value;if(!S.team[0].log.length&&!S.team[1].log.length)setT(this.value=="後攻"?1:0);else save()};
var SUB=-1,SJ=-1,SP="";
function cp(k){var c=S.ch[k];return c[c.length-1]}
function slotOf(j){for(var k=0;k<S.ch.length;k++)if(S.ch[k].indexOf(j)>=0)return k;return -1}
function nmx(j){var p=S.ro[j];return ((p.no?"#"+p.no+" ":"")+(p.nm||""))||"未命名"}
function rows(){var o=[];S.ch.forEach(function(c,k){c.forEach(function(j,n){o.push({j:j,k:k,n:n,off:n<c.length-1})})});for(var j=0;j<S.ro.length;j++)if(slotOf(j)<0&&S.log.some(function(l){return l.b==j}))o.push({j:j,k:-1,n:0,off:false});return o}
function tag(p,rw){return (rw.n?" <small>"+(p.inn||"")+"局換入</small>":"")+(rw.off?" <small>"+(p.out||"")+"局換下</small>":"")}
function subOpen(k){SUB=k;SJ=-1;SP=S.ro[cp(k)].pos||"";subUI();scrollTo(0,0)}
function subUI(){var e=$("subp");if(SUB<0){e.style.display="none";return}var k=SUB,b=[];for(var j=0;j<S.ro.length;j++)if(slotOf(j)<0&&(S.ro[j].nm||S.ro[j].no))b.push(j);
var h='<h2>換人：第 '+S.inn+' 局，'+(k+1)+' 棒</h2><div class="hint">換下 '+nmx(cp(k))+'（換下後不可再上場）</div><div class="hint" style="margin-top:8px">換上球員（點選）</div><div class="chips" style="flex-wrap:wrap">';
b.forEach(function(j){h+='<button class="chip'+(j==SJ?" on":"")+'" onclick="SJ='+j+';subUI()">'+nmx(j)+'</button>'});
if(!b.length)h+='<span class="hint">請先在下方「替補球員」填寫背號或姓名</span>';
h+='</div><div class="row"><label>新守位</label>'+posSel(SP,"x")+'</div><div class="row"><button class="btn o" onclick="SUB=-1;subUI()">取消</button><button class="btn" onclick="doSub()">確定換人</button></div>';
e.innerHTML=h;e.style.display="block";e.onchange=function(ev){if(ev.target.tagName=="SELECT")SP=ev.target.value}}
function doSub(){if(SJ<0||SUB<0)return;var k=SUB,pv=cp(k);S.ro[pv].out=S.inn;S.ro[SJ].inn=S.inn;if(SP)S.ro[SJ].pos=SP;S.ch[k].push(SJ);SUB=-1;SJ=-1;save();rosterUI();draw()}
function subUndo(k){var c=S.ch[k];if(c.length<2)return;var j=c.pop();delete S.ro[j].inn;delete S.ro[c[c.length-1]].out;save();rosterUI();draw()}
function inn(d){S.inn=Math.max(1,S.inn+d);save();draw()}
function rbi(d){S.rbi=Math.max(0,Math.min(4,S.rbi+d));save();draw()}
var POS=[[1,150,188],[2,150,248],[3,206,176],[4,186,128],[5,94,176],[6,114,128],[7,55,85],[8,150,40],[9,245,85]];
function near(x,y){var b=POS[0],bd=1e9;POS.forEach(function(p){var d=(p[1]-x)*(p[1]-x)+(p[2]-y)*(p[2]-y);if(d<bd){bd=d;b=p}});return b[0]}
$("fld").onclick=function(e){var r=this.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.height*270;S.loc={x:Math.round(x),y:Math.round(y),f:near(x,y)};save();draw()};
function clrLoc(){S.loc=null;save();draw()}
function rec(c){S.log.push({b:cp(S.cur),inn:S.inn,r:c,loc:S.loc,rbi:S.rbi});S.cur=(S.cur+1)%9;S.loc=null;S.rbi=0;save();draw()}
function undo(){var l=S.log.pop();if(!l)return;var sl=slotOf(l.b);if(sl>=0)S.cur=sl;S.inn=l.inn;S.loc=l.loc;S.rbi=l.rbi;save();draw()}
function lab(c){for(var i=0;i<R.length;i++)if(R[i][0]==c)return R[i][1];return c}
function isH(c){return c=="1B"||c=="2B"||c=="3B"||c=="HR"}
function draw(){
$("inn").textContent=S.inn;$("rbi").textContent=S.rbi;tg();
$("hf").textContent=(isBot(S.t)?"下":"上")+"半・"+tname(S.t)+" 攻擊";
var o=0;S.log.forEach(function(l){if(l.inn==S.inn)o+=l.r=="DP"?2:(["K","GO","FO","SH","SF"].indexOf(l.r)>=0?1:0)});$("outs").textContent=o;
$("xc").style.display=S.t?"none":"";
$("locT").textContent=S.loc?"守備 "+S.loc.f+" 號位附近":"未選";
var h="";for(var i=0;i<9;i++){h+='<button class="chip'+(i==S.cur?" on":"")+'" onclick="S.cur='+i+';save();draw()">'+bname(cp(i))+'</button>'}$("bat").innerHTML=h;
h="";R.forEach(function(r){h+='<button class="chip '+(r[2]?"h":"o2")+'" onclick="rec(\''+r[0]+'\')">'+r[1]+'</button>'});$("res").innerHTML=h;
h="";S.log.filter(function(l){return l.b==cp(S.cur)&&l.loc}).forEach(function(l){var c=isH(l.r)?"#ffd400":"#fff";h+='<circle cx="'+l.loc.x+'" cy="'+l.loc.y+'" r="5" fill="'+c+'" stroke="#000" stroke-width="1"/>'});if(S.loc)h+='<circle cx="'+S.loc.x+'" cy="'+S.loc.y+'" r="7" fill="none" stroke="#f33" stroke-width="3"/><circle cx="'+S.loc.x+'" cy="'+S.loc.y+'" r="2" fill="#f33"/>';$("mk").innerHTML=h;
h="";S.log.slice().reverse().forEach(function(l){h+='<div><span>'+l.inn+'局 '+bname(l.b)+' <b>'+lab(l.r)+'</b>'+(l.loc?' ('+l.loc.f+')':'')+'</span><span>'+(l.rbi?'打點'+l.rbi:'')+'</span></div>'});$("log").innerHTML=h||'<div class="hint">尚無紀錄</div>';
stats();pits();summ();grid()}
function stats(){
var H=["棒 姓名","打席","打數","安打","二安","三安","全打","打點","得分","四壞","觸身","三振","犧打","犧飛","雙殺","失誤","盜壘"],t="<tr>"+H.map(function(x){return"<th>"+x+"</th>"}).join("")+"</tr>",T=new Array(16).fill(0);
var RW=rows();for(var q=0;q<RW.length;q++){var rw=RW[q],i=rw.j,p=S.ro[i];var L=S.log.filter(function(l){return l.b==i});
var c=function(k){return L.filter(function(l){return l.r==k}).length};
var pa=L.length,bb=c("BB"),hp=c("HBP"),sh=c("SH"),sf=c("SF"),ab=pa-bb-hp-sh-sf,b1=c("1B"),b2=c("2B"),b3=c("3B"),hr=c("HR"),rb=L.reduce(function(a,l){return a+l.rbi},0);
var v=[pa,ab,b1+b2+b3+hr,b2,b3,hr,rb,null,bb,hp,c("K"),sh,sf,c("DP"),c("E"),null];
t+="<tr"+(rw.off?' class="off"':'')+"><td class='n'>"+(rw.k<0?"替":(rw.n?"↳":rw.k+1))+" "+(p.nm||(p.no?"#"+p.no:"—"))+(p.pos?" <small>"+p.pos+"</small>":"")+tag(p,rw)+"</td>";
t+="<td>"+pa+"</td>";
var vals=[ab,v[2],b2,b3,hr,rb];
t+=vals.map(function(x){return"<td>"+x+"</td>"}).join("");
t+="<td>"+p.r+' <button onclick="adj('+i+',\'r\',1)">+</button><button onclick="adj('+i+',\'r\',-1)">−</button></td>';
t+=[bb,hp,v[10],sh,sf,v[13],v[14]].map(function(x){return"<td>"+x+"</td>"}).join("");
t+="<td>"+p.sb+' <button onclick="adj('+i+',\'sb\',1)">+</button><button onclick="adj('+i+',\'sb\',-1)">−</button></td></tr>';
T[0]+=pa;T[1]+=ab;T[2]+=v[2];T[3]+=b2;T[4]+=b3;T[5]+=hr;T[6]+=rb;T[7]+=p.r;T[8]+=bb;T[9]+=hp;T[10]+=v[10];T[11]+=sh;T[12]+=sf;T[13]+=v[13];T[14]+=v[14];T[15]+=p.sb}
t+="<tr><th>合計</th><th>"+T[0]+"</th><th>"+T[1]+"</th><th>"+T[2]+"</th><th>"+T[3]+"</th><th>"+T[4]+"</th><th>"+T[5]+"</th><th>"+T[6]+"</th><th>"+T[7]+"</th><th>"+T[8]+"</th><th>"+T[9]+"</th><th>"+T[10]+"</th><th>"+T[11]+"</th><th>"+T[12]+"</th><th>"+T[13]+"</th><th>"+T[14]+"</th><th>"+T[15]+"</th></tr>";
$("st").innerHTML=t;S._T=T}
function grid(){var n=Math.max(9,S.inn);S.log.forEach(function(l){if(l.inn>n)n=l.inn});var t="<tr><th>棒 姓名</th>";for(var j=1;j<=n;j++)t+="<th>"+j+"</th>";t+="</tr>";
var RW=rows();for(var q=0;q<RW.length;q++){var rw=RW[q],i=rw.j,p=S.ro[i];t+="<tr"+(rw.off?' class="off"':'')+"><td class='n'>"+(rw.k<0?"替":(rw.n?"↳":rw.k+1))+" "+(p.nm||(p.no?"#"+p.no:"—"))+(p.pos?" <small>"+p.pos+"</small>":"")+tag(p,rw)+"</td>";
for(var j=1;j<=n;j++){var c=S.log.filter(function(l){return l.b==i&&l.inn==j}).map(function(l){return '<div class="g'+(isH(l.r)?' h':'')+'">'+lab(l.r)+(l.loc?l.loc.f:'')+(l.rbi?' 打'+l.rbi:'')+'</div>'}).join("");t+='<td class="c" onclick="go('+i+','+j+')">'+c+'</td>'}t+="</tr>"}
$("gt").innerHTML=t}
function go(i,j){var sl=slotOf(i);if(sl>=0)S.cur=sl;S.inn=j;save();tab('rec')}
function adj(i,k,d){S.ro[i][k]=Math.max(0,S.ro[i][k]+d);save();draw()}
function summ(){var c=function(k){return S.log.filter(function(l){return l.r==k}).length},ab=0,pa=S.log.length,bb=c("BB"),hp=c("HBP"),sh=c("SH"),sf=c("SF");
var a=pa-bb-hp-sh-sf,io=0,tie=0,r=S._T?S._T[7]:0,lob=+S.ex.lob||0,po=+S.ex.po||0;
$("sm").innerHTML="<b>AB</b> "+a+" + <b>SH</b> "+sh+" + <b>SF</b> "+sf+" + <b>BB</b> "+bb+" + <b>HP</b> "+hp+" = <b>SUM</b> "+(a+sh+sf+bb+hp)+" ｜ <b>R</b> "+r+" + <b>LOB</b> "+lob+" + <b>PO</b> "+po+" = <b>SUM</b> "+(r+lob+po)}
function pits(){var H=[["nm","投手"],["pc","投球數"],["k","三振"],["bb","四壞"],["h","被安打"],["r","失分"],["er","自責分"]],h="";
S.pit.forEach(function(p,i){var o=p.outs||0,d=p.dec||"";h+='<div style="border-bottom:1px solid var(--bd);padding:8px 0"><input style="width:100%" placeholder="投手姓名" value="'+p.nm+'" oninput="S.pit['+i+'].nm=this.value;save()">';
h+='<div class="step"><span>勝敗</span><select onchange="S.pit['+i+'].dec=this.value;save()">'+["","勝","敗","救援","無關"].map(function(x){return'<option'+(x==d?' selected':'')+'>'+x+'</option>'}).join("")+'</select></div>';
h+='<div class="step"><span>投球局數 <small class="hint">(每按＋＝1出局)</small></span><div style="display:flex;gap:8px;align-items:center"><button onclick="pa('+i+',\'outs\',-1)">−</button><b style="min-width:3em">'+Math.floor(o/3)+'.'+(o%3)+'</b><button onclick="pa('+i+',\'outs\',1)">+</button></div></div>';
H.slice(1).forEach(function(x){if(x[0]=="pc"){h+='<div class="step"><span>投球數</span><input type="number" inputmode="numeric" min="0" style="width:6em;text-align:center;font-size:18px" value="'+(p.pc||0)+'" oninput="S.pit['+i+'].pc=Math.max(0,parseInt(this.value)||0);save()"></div>';return}h+='<div class="step"><span>'+x[1]+'</span><div style="display:flex;gap:8px;align-items:center"><button onclick="pa('+i+',\''+x[0]+'\',-1)">−</button><b>'+(p[x[0]]||0)+'</b><button onclick="pa('+i+',\''+x[0]+'\',1)">+</button></div></div>'});h+='</div>'});$("pl").innerHTML=h}
function pa(i,k,d){S.pit[i][k]=Math.max(0,(S.pit[i][k]||0)+d);save();draw()}
function addP(){S.pit.push({nm:"",pc:0,k:0,bb:0,h:0,r:0});save();draw()}
var rt;function reset(){var b=$("rb");if(!rt){b.textContent="再按一次確認清除";rt=setTimeout(function(){rt=0;b.textContent="清除本場全部資料"},3000);return}clearTimeout(rt);rt=0;b.textContent="清除本場全部資料";S=init();save();fill();draw()}
function fill(){["opp","date","venue","side","gno","rcd","coach"].forEach(function(i){$(i).value=S.f[i]||(i=="side"?"先攻":"")});["wrbi","dp","lob","po"].forEach(function(i){$(i).value=S.ex[i]||""});rosterUI()}
load();fill();draw();
</script>
